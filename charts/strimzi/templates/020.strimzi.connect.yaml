{{- if .Values.lsdmesp.strimzi.connect.enabled -}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: lsdmesp
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: {{ .Values.lsdmesp.strimzi.version }}
  replicas: {{ .Values.lsdmesp.strimzi.connect.replicas }}
  bootstrapServers: {{ .Values.lsdmesp.strimzi.connect.bootstrap }}
  authentication:
    type: scram-sha-512
    username: lsdmesp
    passwordSecret:
      secretName: lsdmesp
      password: password
  groupId: connect-cluster
  configStorageTopic: connect-cluster-configs
  offsetStorageTopic: connect-cluster-offsets
  statusStorageTopic: connect-cluster-status
  config:
    heartbeat.interval.ms: 3000
    offset.flush.interval.ms: 60000
    offset.flush.timeout.ms: 5000
    rebalance.timeout.ms: 60000
    request.timeout.ms: 40000
    session.timeout.ms: 10000
    worker.sync.timeout.ms: 3000
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
  livenessProbe:
    failureThreshold: 20
    initialDelaySeconds: 180
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 20
    initialDelaySeconds: 180
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 10
  jvmOptions:
    -Xms: {{ .Values.lsdmesp.strimzi.connect.jvm.Xms }}
    -Xmx: {{ .Values.lsdmesp.strimzi.connect.jvm.Xmx }}
  logging:
    loggers:
      connect.root.logger.level: WARN
    type: inline
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: connect-metrics
        key: metrics-config.yml
  resources:
{{- toYaml .Values.lsdmesp.strimzi.connect.resources | nindent 4 }}
  template:
    connectContainer:
      volumeMounts:
        - name: lsdmesp-tls
          mountPath: /mnt/kafka_basicauth
    pod:
      volumes:
        - name: lsdmesp-tls
          secret:
            defaultMode: 292
            secretName: lsdmesp-tls
  tls:
    trustedCertificates:
      - secretName: lsdmesp-cluster-ca-cert
        certificate: ca.crt
{{- end }}
